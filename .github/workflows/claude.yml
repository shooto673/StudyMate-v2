name: Claude Auto-Implement

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-implement:
    if: |
      (github.event_name == 'issues' &&
       github.event.label.name == 'claude-implement') ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       github.event.issue.pull_request == null)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are working in the StudyMate repository.

            Read CLAUDE.md and REVIEW.md before making changes.

            Task source:
            - Use the current GitHub issue or issue comment as the task.
            - Keep the implementation scope narrow.
            - If this is Issue #1, change README.md only.

            Required implementation for Issue #1:
            - Edit README.md only.
            - Add exactly this line near the end of README.md:
              AI orchestration test: GitHub Issue -> Claude -> PR flow enabled.
            - Create a new branch.
            - Commit the README.md change.
            - Open a pull request.

            Hard rules:
            - Do not modify frontend/, backend/, tests/, billing, auth, or workflows unless explicitly requested.
            - Do not commit frontend/dist/.
            - Do not write secrets into code.
            - Open a pull request with a concise summary.
          claude_args: |
            --allowedTools Read,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr view:*)

  claude-review:
    if: |
      github.event_name == 'issues' &&
      github.event.label.name == 'claude-review' &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request using REVIEW.md.

            Focus on:
            - scope control
            - no unintended file changes
            - no app logic changes
            - test and safety checklist
