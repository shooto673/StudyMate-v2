name: Claude Auto-Implement

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-implement:
    if: |
      (github.event_name == 'issues' &&
       github.event.label.name == 'claude-implement') ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       github.event.issue.pull_request == null)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_context: |
            このリポジトリのルールは CLAUDE.md を参照してください。
            実装後は必ず node tests/run.mjs を実行し、全 pass を確認してください。
            ブランチ名は claude/<issue番号>-<slug> にしてください。
            frontend/ の変更は Issue に明示されない限り行わないでください。

  claude-review:
    if: |
      github.event_name == 'issues' &&
      github.event.label.name == 'claude-review' &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_context: |
            REVIEW.md のチェックリストに従って PR をレビューしてください。
            approve/request_changes の判断と、具体的な確認結果をコメントしてください。
